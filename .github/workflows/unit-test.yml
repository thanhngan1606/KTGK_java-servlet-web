name: Run Unit Tests

on:
  push:
    branches:
      - feature-jv1
      - feature-jv2

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Run Unit Tests
        run: mvn test -Dmaven.test.failure.ignore=false
